[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kernels>=0.11.7",
    "langsmith>=0.8.3",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
    "ujson>=5.12.1",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.45.0"]
# CPU-only PyTorch (no CUDA) — use on machines without NVIDIA GPU
# Install with: pip install -e ".[cpu]"  or  uv sync --extra cpu
cpu = [
    "torch==2.9.1",
]

# ── PyTorch source selection ───────────────────────────────────────────────────
# Default: CUDA 12.8 (GPU). For CPU-only machines, run:
#   uv sync --extra cpu
# or install manually:
#   pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'cpu-only'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
